[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:laravel]
command=/bin/bash -c "exec php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
directory=/var/www/laravel
environment=PHP_CLI_SERVER_WORKERS="4"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fastapi]
command=/var/www/python/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1
directory=/var/www/python
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
